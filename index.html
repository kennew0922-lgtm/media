        body {

            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 35, 76, 1);
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 セクションタイトル */
        .section-title {
            background: #000;
            color: #00f2fe;
            padding: 8px 15px;
            margin: 15px 0 15px 0;
            font-size: 11px;
            font-weight: bold;
            border-left: 4px solid #00f2fe;
            letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* 🌸 魔法の切り替えボタン（ケンくん指定色） */
        .magic-btn {
            background-color: #000;      /* 背景：黒 */
            color: #00f2fe;             /* 文字：水色 */
            border: 1px solid rgba(0, 242, 254, 0.5);
            padding: 4px 12px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 242, 254, 0.2);
        }

        .magic-btn:hover {
            background-color: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
            transform: translateY(-1px);
        }

        .magic-btn:active {
            transform: translateY(1px);
        }

        /* 🌸 ランチャーグリッド */
        .launcher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
            gap: 8px; 
            margin-bottom: 30px;
        }

        .memory-card {
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            display: block;
            text-decoration: none;
            border-radius: 4px;
        }

        .launcher-card {
            padding: 3px; 
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .memory-card:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: scale(1.15);
            z-index: 10;
        }

        .launcher-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        .video-frame-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
            border-radius: 2px;
            overflow: hidden;
            background: #000;
        }

        .video-frame-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
