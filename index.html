                /* 🌸 上部固定バナー */

                /* 🌸 セクションタイトル（追加） */

            font-size: 11px;
            font-weight: bold;

            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }


/* 🌸 ランチャーグリッド（アイコン密度を最適化） */
.launcher-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
    gap: 8px; 
    margin-bottom: 30px;
}

/* 🌸 ベースとなるカード設定（共通） */
.memory-card {
    border: 1px solid rgba(0, 242, 254, 0.3);
    background: rgba(255, 255, 255, 0.05);
    transition: 0.3s;
    display: block;
    text-decoration: none;
    border-radius: 4px;
}

/* 🌸 ランチャー用（正方形）の個別調整 */
.launcher-card {
    padding: 3px; 
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 🌸 ホバー時のエフェクト：光と拡大 */
.memory-card:hover {
    border-color: #00f2fe;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    transform: scale(1.15); /* 60%サイズに合わせて程よい拡大に ✨ */
    z-index: 10;
}

/* 🌸 アイコン画像の収まり設定 */
.launcher-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


        /* --- コンテンツエリア --- */
        .container {
            max-width: 950px;
            margin: 0 auto;
            /* 35px(バナー) + 20px(余白) = 55px */
            padding-top: 20px; 
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2b2b2b;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            letter-spacing: 0.05em;
        }

        /* --- 🌸 見出しの固定設定（バナーのすぐ下） --- */
        th {
            background-color: #00234c;
            color: white;
            position: sticky;
            top: 0px; /* バナーの高さ分だけ下げる */
            z-index: 100;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* --- 🌸 デザインの微調整 --- */
        td {
            padding: 10px 15px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr:nth-child(even) {
            background-color: #333333;
        }

        tbody tr:hover {
            background-color: #3a3a3a;
        }

        .key {
            color: #00d4ff;
            font-weight: bold;
        }

                /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
